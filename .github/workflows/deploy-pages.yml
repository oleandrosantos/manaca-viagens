name: Deploy Estático (GitHub Pages)

on:
  push:
    branches:
      - feature/payload-cms
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Base path para GitHub Pages (use /manaca-viagens ou deixe em branco se usar domínio customizado)'
        required: false
        default: '/manaca-viagens'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Construir versão estática (com seed de notícias e dados)
        env:
          NEXT_BASE_PATH: ${{ github.event.inputs.base_path || vars.NEXT_BASE_PATH || '/manaca-viagens' }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'manaca-viagens-static-build-secret-key-min-32-chars!' }}
        run: npm run build:static

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
