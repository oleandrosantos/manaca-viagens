name: Validate Payload migration

on:
  push:
    branches: [feature/payload-cms]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate static export (without publishing)
        env:
          NEXT_BASE_PATH: /manaca-viagens
          PAYLOAD_SECRET: static-validation-only-not-a-live-auth-secret
        run: npm run build:static
